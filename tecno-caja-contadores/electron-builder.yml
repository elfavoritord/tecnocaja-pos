appId: com.tecnocaja.contadores
productName: "Tecno Caja Contadores"
copyright: "© 2025 Tecno Caja"

# La app vive en el subdirectorio tecno-caja-contadores/
directories:
  app: tecno-caja-contadores
  output: tecno-caja-contadores/dist
  buildResources: tecno-caja-contadores/build

# Archivos a incluir en el paquete
files:
  - main.js
  - preload.js
  - server.js
  - server/**/*
  - public/**/*
  - "!public/**/*.map"

# Módulos extra (desde el node_modules del proyecto padre)
extraMetadata:
  main: main.js

# Node modules del directorio raíz
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: x64
  icon: ../electron/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: "Tecno Caja Contadores"
  installerIcon: ../electron/icon.png
  uninstallerIcon: ../electron/icon.png
  include: null

publish:
  - provider: github
    owner: elfavoritord
    repo: tecnocaja-contadores
    releaseType: release
