appId: com.tecnocaja.contadores
productName: "Tecno Caja Contadores"
copyright: "© 2025 Tecno Caja"

# La app vive en el subdirectorio tecno-caja-contadores/
directories:
  app: tecno-caja-contadores
  output: tecno-caja-contadores/dist
  buildResources: tecno-caja-contadores/build

# Archivos a incluir en el paquete
files:
  - main.js
  - preload.js
  - server.js
  - mailer.js
  - asistente.js
  - server/**/*
  - public/**/*
  - "!public/**/*.map"

# Módulos extra (desde el node_modules del proyecto padre)
extraMetadata:
  main: main.js

# Archivos config fuera del asar (accesibles vía process.resourcesPath)
extraResources:
  - from: tecno-caja-contadores/.env
    to: .env
  - from: tecno-caja-contadores/firebase-service-account.json
    to: firebase-service-account.json

# Node modules del directorio raíz
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: "Tecno Caja Contadores"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: null

publish:
  - provider: github
    owner: elfavoritord
    repo: tecnocaja-contadores
    releaseType: release
