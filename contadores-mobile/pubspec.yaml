name: tecno_caja_contadores
description: Tecno Caja Contadores — App móvil para gestión contable y fiscal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Diseño
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  animations: ^2.0.11

  # Persistencia local
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Archivos y documentos
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # PDF y exportación
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6

  # Utilidades
  http: ^1.4.0
  intl: ^0.19.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1
  image_cropper: ^8.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
