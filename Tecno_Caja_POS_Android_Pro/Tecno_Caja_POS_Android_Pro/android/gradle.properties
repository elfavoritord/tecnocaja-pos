
# Esta maquina de desarrollo tiene poca RAM disponible (~4GB totales); el
# -Xmx8G que trae la plantilla de Flutter por defecto tumba al daemon de
# Gradle con OutOfMemoryError antes de terminar el build. Si Emilio compila
# en otra maquina con mas memoria, puede subir estos valores para acelerar
# builds (por ejemplo -Xmx4G), pero estos limites conservadores son seguros
# en cualquier equipo.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.incremental=false
android.useAndroidX=true
