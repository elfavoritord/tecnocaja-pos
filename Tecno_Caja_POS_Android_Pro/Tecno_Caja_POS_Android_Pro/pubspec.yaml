name: tecno_caja_pos_android
description: Tecno Caja POS Android - punto de venta offline-first con sincronizacion a Tecno Caja POS Windows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  fl_chart: ^0.69.0

  # Estado / navegacion / DI
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Persistencia local
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2

  # Identidad / seguridad
  uuid: ^4.5.1
  local_auth: ^2.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0

  # Red
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  cloud_functions: ^5.3.0
  firebase_storage: ^12.3.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0
  firebase_messaging: ^15.1.0
  firebase_app_check: ^0.3.1
  google_sign_in: ^7.1.1

  # Hardware POS
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.6
  unified_esc_pos_printer: 1.0.1
  barcode: ^2.2.9

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1

  # Reportes / exportacion
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  share_plus: ^10.1.2
  csv: ^6.0.0

  # Utilidades
  intl: ^0.20.2
  collection: ^1.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
