name: Instalador de Tecno Caja POS

on:
  push:
    # Una rama release/<versión> por publicación; la versión sale de package.json.
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Conservar saltos de línea del repositorio
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Leer la versión
        id: version
        run: |
          $version = node -p "require('./package.json').version"
          if ("$env:GITHUB_REF_NAME" -ne "release/$version") { throw "La rama $env:GITHUB_REF_NAME no corresponde a la versión $version de package.json." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "TC_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --runInBand --silent
      - name: Preparar MariaDB y Visual C++ para Windows x64
        run: |
          $mariaZip = Join-Path $env:RUNNER_TEMP 'mariadb-12.2.2-winx64.zip'
          $mariaDir = Join-Path $env:RUNNER_TEMP 'mariadb-12.2.2'
          curl.exe --fail --location --retry 3 --output $mariaZip https://archive.mariadb.org/mariadb-12.2.2/winx64-packages/mariadb-12.2.2-winx64.zip
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar MariaDB.' }
          if ((Get-FileHash -LiteralPath $mariaZip -Algorithm SHA256).Hash -ne 'b34bb91f0dd4bd184f420288a12aace2b5fcb20734f2b880075c36150d4641c6') {
            throw 'La descarga de MariaDB no coincide con el SHA-256 oficial.'
          }
          Expand-Archive -LiteralPath $mariaZip -DestinationPath $mariaDir
          $mariaSources = @(Get-ChildItem -LiteralPath $mariaDir -Directory | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName 'bin\mariadbd.exe')
          })
          if ($mariaSources.Count -ne 1) { throw 'No se encontró una sola distribución de MariaDB.' }
          $env:TECNO_CAJA_MARIADB_SOURCE = $mariaSources[0].FullName
          node scripts/prepare-mariadb-bundle.js
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el paquete de MariaDB.' }

          curl.exe --fail --location --retry 3 --output build/vc_redist.x64.exe https://aka.ms/vs/17/release/14.44.35211/VC_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar Visual C++ Redistributable.' }
          $signature = Get-AuthenticodeSignature -LiteralPath 'build/vc_redist.x64.exe'
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw 'El redistribuible de Visual C++ no tiene una firma válida de Microsoft.'
          }

      - name: Compilar el instalador NSIS
        run: |
          $builderConfig = Join-Path $env:RUNNER_TEMP 'tecnocaja-electron-builder.json'
          node -e "const fs = require('node:fs'); const {build} = require('./package.json'); fs.writeFileSync(process.argv[1], JSON.stringify({...build, npmRebuild: false}));" $builderConfig
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar la configuración de Electron Builder.' }
          npx --no-install electron-builder --win nsis --publish never --config $builderConfig
      - name: Verificar los archivos del actualizador
        run: |
          @'
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const asar = require('@electron/asar');
          const yaml = require('js-yaml');

          async function main() {
            const {version} = require('./package.json');
            const notes = require('./update-manifest.json');
            const installer = `TecnoCaja-Setup-${version}.exe`;
            const manifest = yaml.load(fs.readFileSync('dist/latest.yml', 'utf8'));
            const entry = manifest.files.find(file => file.url === installer);
            assert.equal(version, process.env.TC_VERSION);
            assert.equal(notes.version, version);
            assert.equal(manifest.version, version);
            assert.equal(manifest.path, installer);
            assert.equal(entry.size, fs.statSync(`dist/${installer}`).size);
            assert(fs.statSync(`dist/${installer}.blockmap`).size > 0);
            const hash = crypto.createHash('sha512');
            for await (const bytes of fs.createReadStream(`dist/${installer}`)) hash.update(bytes);
            const sha512 = hash.digest('base64');
            assert.equal(manifest.sha512, sha512);
            assert.equal(entry.sha512, sha512);

            const dir = 'dist/win-unpacked/resources';
            const archive = `${dir}/app.asar`;
            const forbidden = /(?:^|[\\/])(?:\.env$|firebase-key\.json$|firebase-service-account\.json$)/i;
            const files = [...fs.readdirSync(dir, {recursive: true}), ...asar.listPackage(archive)];
            assert(!files.some(file => forbidden.test(file)), 'No se pueden distribuir credenciales privadas.');
            assert.equal(JSON.parse(asar.extractFile(archive, 'package.json')).version, version);
            for (const file of ['index.html', 'js/productos.js', 'js/ventas.js', 'server.js']) {
              assert(asar.extractFile(archive, file).equals(fs.readFileSync(file)), file);
            }
            const scope = 'Actualización para equipos con Tecno Caja instalado. En una instalación nueva, la sincronización de clientes y usuarios requiere configurar Firebase por separado.';
            fs.writeFileSync('dist/release-notes.md', [scope, '', ...notes.changes.map(change => `- ${change}`), ''].join('\n'));
          }

          main().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node -
          if ($LASTEXITCODE -ne 0) { throw 'Falló la verificación del instalador.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TecnoCaja-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/TecnoCaja-Setup-${{ steps.version.outputs.version }}.exe
            dist/TecnoCaja-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
            dist/release-notes.md
          if-no-files-found: error
          compression-level: 0

  draft:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TecnoCaja-${{ needs.installer.outputs.version }}-windows-x64
          path: dist
      - name: Subir archivos a GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Tecno Caja POS $VERSION" --notes-file dist/release-notes.md \
            "dist/TecnoCaja-Setup-$VERSION.exe" "dist/TecnoCaja-Setup-$VERSION.exe.blockmap" dist/latest.yml
