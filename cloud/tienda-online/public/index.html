<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Tienda en línea</title>
  <!--PWA-->
  <script src="/static/tema.js?v=18"></script>
  <link rel="stylesheet" href="/static/styles.css?v=18">
</head>
<body>
  <header class="top" id="top">
    <div class="wrap top-in">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" id="brand" href="/" title="Ir al inicio de la tienda"><h1>Cargando…</h1></a>
      <div class="search-box" id="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search" id="buscar" type="search" placeholder="Buscar productos…" autocomplete="off" aria-label="Buscar productos">
      </div>
      <div class="acts">
        <a class="icon-btn hidden" id="llamar-btn" href="#" aria-label="Llamar a la tienda" title="Llamar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        </a>
        <a class="icon-btn hidden" id="wa-btn" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp" title="WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M9 8.5c-.5.5-.8 1.3-.7 2 .3 2.3 3.5 5.3 5.9 5.2.8 0 1.6-.6 1.8-1.4l-1.9-1.1-.9.8c-1-.5-1.9-1.4-2.4-2.4l.8-.9L10.5 8.8z"/></svg>
        </a>
        <button class="icon-btn" id="tema-btn" type="button" aria-label="Cambiar a modo oscuro"></button>
        <button class="icon-btn solo-pc" id="pedidos-btn" type="button" aria-label="Mis pedidos" title="Mis pedidos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 7.5h6M9 11.5h6M9 15.5h4"/></svg>
        </button>
        <button class="icon-btn solo-pc" id="fav-btn" type="button" aria-label="Ver favoritos" title="Favoritos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.3A5.3 5.3 0 0 1 12 5.9a5.3 5.3 0 0 1 9.6 5.3c-2.1 4.7-9.6 9.3-9.6 9.3z"/></svg>
          <span class="badge hidden" id="fav-count">0</span>
        </button>
        <button class="cart-btn solo-pc" id="cart-btn" type="button" aria-label="Ver carrito" title="Carrito">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6.2"/></svg>
          <span class="badge hidden" id="cart-count">0</span>
        </button>
      </div>
    </div>
    <nav class="nav-pc" id="nav-pc" aria-label="Menú de la tienda"></nav>
  </header>

  <main id="app">
    <div class="sk" aria-label="Cargando la tienda" role="status">
      <div class="sk-hero sk-b"></div>
      <div class="wrap sk-grid">
        <div class="sk-card"><div class="sk-b sk-img"></div><div class="sk-b sk-l"></div><div class="sk-b sk-l c"></div></div>
        <div class="sk-card"><div class="sk-b sk-img"></div><div class="sk-b sk-l"></div><div class="sk-b sk-l c"></div></div>
        <div class="sk-card"><div class="sk-b sk-img"></div><div class="sk-b sk-l"></div><div class="sk-b sk-l c"></div></div>
        <div class="sk-card"><div class="sk-b sk-img"></div><div class="sk-b sk-l"></div><div class="sk-b sk-l c"></div></div>
      </div>
    </div>
  </main>

  <!-- Carrito fijo cuando el negocio quita el encabezado o el carrito de arriba -->
  <button class="cart-flota" id="cart-flota" type="button" aria-label="Ver carrito" data-nav="carrito">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6.2"/></svg>
    <span class="badge hidden" id="flota-count">0</span>
  </button>

  <!-- Barra de abajo (teléfono), como una app -->
  <nav class="tabbar" id="tabbar" aria-label="Navegación">
    <button type="button" data-nav="inicio" class="on" aria-label="Inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Inicio</span>
    </button>
    <button type="button" data-nav="favoritos" aria-label="Favoritos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.3A5.3 5.3 0 0 1 12 5.9a5.3 5.3 0 0 1 9.6 5.3c-2.1 4.7-9.6 9.3-9.6 9.3z"/></svg><span>Favoritos</span>
      <b class="tb-badge hidden" id="tb-fav-count">0</b>
    </button>
    <button type="button" data-nav="carrito" class="tb-cart" id="tb-cart" aria-label="Carrito">
      <span class="tb-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6.2"/></svg>
        <b class="tb-badge hidden" id="tb-cart-count">0</b></span>
    </button>
    <button type="button" data-nav="ofertas" aria-label="Ofertas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Ofertas</span>
    </button>
    <button type="button" data-nav="pedidos" aria-label="Mis pedidos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 7.5h6M9 11.5h6M9 15.5h4"/></svg><span>Pedidos</span>
    </button>
  </nav>

  <!-- Menú del teléfono -->
  <div class="overlay" id="menu-fondo" data-act="cerrar-menu"></div>
  <aside class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menú de la tienda">
    <header>
      <strong id="menu-nombre"></strong>
      <button class="menu-x" type="button" data-act="cerrar-menu" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="menu-cuerpo" id="menu-cuerpo"></div>
  </aside>

  <!-- Carrito, favoritos, mis pedidos y checkout -->
  <div class="overlay" id="overlay" data-act="cerrar"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <header>
      <button class="back x" type="button" data-act="cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <h3 id="panel-title">Tu carrito</h3>
      <span class="panel-extra" id="panel-extra"></span>
    </header>
    <div class="content" id="panel-content"></div>
    <footer id="panel-foot"></footer>
  </aside>

  <!-- Detalle del producto y vista rápida -->
  <div class="modal-overlay" id="modal-overlay" data-act="cerrar-detalle"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="grip" data-act="cerrar-detalle" aria-hidden="true"></div>
    <button class="modal-x" type="button" data-act="cerrar-detalle" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/diseno-aplicar.js?v=18"></script>
  <script src="/static/secciones.js?v=18"></script>
  <script src="/static/marquee.js?v=18"></script>
  <script src="/static/app.js?v=18"></script>
</body>
</html>
