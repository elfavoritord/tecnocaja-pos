<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecno Caja Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1623;
      color: #e2e8f0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* Fondo con gradiente sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(59,130,246,.12) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(99,102,241,.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      animation: fadeDown .5s ease both;
    }

    .logo-icon {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 32px rgba(249,115,22,.35);
    }

    .logo-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: #f1f5f9;
    }

    .logo-text span {
      font-size: .78rem;
      color: #64748b;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .version {
      font-size: .7rem;
      color: #334155;
      margin-bottom: 36px;
      animation: fadeDown .5s .1s ease both;
    }

    .progress-wrap {
      width: 220px;
      animation: fadeUp .5s .2s ease both;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.07);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 99px;
      width: 0%;
      transition: width .4s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 8px rgba(99,102,241,.6);
    }

    .progress-label {
      font-size: .72rem;
      color: #475569;
      text-align: center;
      letter-spacing: .03em;
      min-height: 1.1em;
      transition: opacity .2s;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }
    .dots span {
      width: 3px;
      height: 3px;
      background: #475569;
      border-radius: 50%;
      animation: dot .9s infinite both;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes dot {
      0%, 80%, 100% { opacity: .2; transform: scale(.8); }
      40%            { opacity: 1;  transform: scale(1.1); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .corner {
      position: fixed;
      bottom: 16px;
      right: 18px;
      font-size: .64rem;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">
      <h1>Tecno Caja</h1>
      <span>Panel de Administración</span>
    </div>
  </div>

  <div class="version" id="ver">v1.0.0</div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="bar"></div>
    </div>
    <div class="progress-label" id="label">
      Iniciando<span class="dots"><span></span><span></span><span></span></span>
    </div>
  </div>

  <div class="corner">Tecno Caja © 2026</div>

  <script>
    const bar   = document.getElementById('bar');
    const label = document.getElementById('label');

    const steps = [
      { pct: 20, msg: 'Cargando configuración' },
      { pct: 50, msg: 'Iniciando servidor' },
      { pct: 75, msg: 'Conectando con Firebase' },
      { pct: 90, msg: 'Verificando servicios' },
      { pct: 100, msg: 'Listo' },
    ];

    let step = 0;

    function advance(pct, msg) {
      bar.style.width = pct + '%';
      label.innerHTML = msg + '<span class="dots"><span></span><span></span><span></span></span>';
    }

    // Exponer para que main.js pueda enviar progreso via IPC si se desea en el futuro
    window.setProgress = (pct, msg) => advance(pct, msg);

    // Animación distribuida en ~2.2s para llenar el tiempo mínimo del splash
    const delays = [0, 800, 1700, 2800, 4000];
    steps.forEach((s, i) => {
      setTimeout(() => advance(s.pct, s.msg), delays[i] + 200);
    });
  </script>
</body>
</html>
